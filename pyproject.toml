[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-umbrella"
version = "0.1.0"
description = "Backend-only brain for AI companions: LangGraph agent loop, tools, memory"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1,<2",
  "pydantic>=2.8,<3",
  "asyncpg>=0.29,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

voice = [
  "faster-whisper>=1.1,<2",
  "piper-tts>=1.3,<2",
]

realtime = [
  "pipecat-ai[livekit,silero]==0.0.108",
]

[tool.setuptools.package-data]
"companion.server" = ["playground.html", "plugins/*/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["companion*"]
